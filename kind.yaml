kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Web page and API
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
      # Keycloak
      - containerPort: 30180
        hostPort: 8180
        listenAddress: "127.0.0.1"
      # Prometheus
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
      # Alertmanager
      - containerPort: 30093
        hostPort: 9093
        listenAddress: "127.0.0.1"
